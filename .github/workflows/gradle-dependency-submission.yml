name: Gradle Dependency Submission

on:
  push:
    branches: [main]
    paths:
      - "apps/minecraft/**/*.gradle"
      - "apps/minecraft/**/*.gradle.kts"
      - "apps/minecraft/gradle/**"
      - "apps/minecraft/gradle.properties"
      - "apps/minecraft/gradlew"
      - ".github/workflows/gradle-dependency-submission.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gradle-dependency-submission
  cancel-in-progress: true

jobs:
  submit:
    name: Submit Gradle dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/dependency-submission@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6
        with:
          cache-provider: basic
          build-root-directory: apps/minecraft
          dependency-graph: generate-and-submit

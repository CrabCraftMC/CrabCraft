name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Build Discord bot → tarball of compiled files ────────────────
  build-bot:
    name: Build Discord Bot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - name: Type-check and compile bot
        run: bun run build --filter=@crabcraft/bot
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"

      - name: Stage release bundle
        run: |
          mkdir -p release/bot
          cp -r apps/bot/src release/bot/src
          cp -r apps/bot/dist release/bot/dist
          cp apps/bot/package.json release/bot/package.json
          cp apps/bot/tsconfig.json release/bot/tsconfig.json
          cp apps/bot/.env.example release/bot/.env.example 2>/dev/null || true
          mkdir -p release/bot/packages
          cp -r packages/db release/bot/packages/db
          cp -r packages/shared release/bot/packages/shared
          cp -r packages/tsconfig release/bot/packages/tsconfig
          cp package.json release/bot/root-package.json
          cp bun.lock release/bot/bun.lock
          tar -czf crabcraft-bot-${{ github.sha }}.tar.gz -C release/bot .

      - uses: actions/upload-artifact@v4
        with:
          name: crabcraft-bot
          path: crabcraft-bot-*.tar.gz
          retention-days: 30

  # ── Build Web → Next.js standalone output + Docker image ─────────
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - name: Build Next.js app
        run: bun run build --filter=@crabcraft/web
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"

  docker-web:
    name: Publish Web Docker Image
    needs: build-web
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build Minecraft plugin → Spigot and Velocity JARs ────────────
  build-plugin:
    name: Build Minecraft Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate tag matches gradle.properties version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "^version=${TAG_VERSION}\$" apps/minecraft/gradle.properties; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match apps/minecraft/gradle.properties:"
            cat apps/minecraft/gradle.properties
            echo "Expected: version=${TAG_VERSION}"
            exit 1
          fi

      - name: Build JARs with Gradle
        run: |
          chmod +x apps/minecraft/gradlew
          cd apps/minecraft
          GRADLE_ARGS=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            GRADLE_ARGS="-Pversion=${GITHUB_REF_NAME#v}"
          fi
          ./gradlew build $GRADLE_ARGS

      - name: Generate SHA256SUMS.txt
        run: |
          cd apps/minecraft/jars
          sha256sum *.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CrabUtilities-Spigot
          path: apps/minecraft/spigot/build/libs/CrabUtilities*.jar
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: CrabUtilities-Velocity
          path: apps/minecraft/velocity/build/libs/CrabUtilities-Velocity*.jar
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: CrabUtilities-All
          path: |
            apps/minecraft/jars/*.jar
            apps/minecraft/jars/SHA256SUMS.txt
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: CrabUtilities-Checksums
          path: apps/minecraft/jars/SHA256SUMS.txt
          retention-days: 30

  # ── Auto-tag: bump patch version and tag on every push to main ───
  auto-release:
    name: Auto Tag & Release
    if: github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'Release v')
    needs: [build-bot, build-plugin, docker-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version, commit, and tag
        run: |
          CURRENT=$(grep '^version=' apps/minecraft/gradle.properties | cut -d= -f2)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          COMMIT_MSG="${{ github.event.head_commit.message }}"

          if echo "$COMMIT_MSG" | grep -qi '\[major\]'; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$COMMIT_MSG" | grep -qi '\[minor\]'; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Bumping ${CURRENT} → ${NEW_VERSION}"

          sed -i "s/^version=.*$/version=${NEW_VERSION}/" apps/minecraft/gradle.properties

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/minecraft/gradle.properties
          git commit -m "Release v${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push origin main --tags

  # ── Optional: attach all artifacts to a release on tagged pushes ─
  release:
    name: Publish Release Assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-bot, build-plugin, docker-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "{crabcraft-bot,CrabUtilities-Spigot,CrabUtilities-Velocity,CrabUtilities-Checksums}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/crabcraft-bot/*.tar.gz
            artifacts/CrabUtilities-Spigot/*.jar
            artifacts/CrabUtilities-Velocity/*.jar
            artifacts/CrabUtilities-Checksums/SHA256SUMS.txt
          generate_release_notes: true

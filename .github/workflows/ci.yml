name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build Discord bot → tarball of compiled files ────────────────
  build-bot:
    name: Build Discord Bot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - name: Test bot
        run: bun run --cwd apps/bot test
        env:
          NAPI_RS_ENFORCE_VERSION_CHECK: "1"

      - name: Type-check and compile bot
        run: bun run build --filter=@crabcraft/bot
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"

      - name: Stage release bundle
        run: |
          mkdir -p release/bot
          cp -r apps/bot/src release/bot/src
          cp -r apps/bot/dist release/bot/dist
          cp apps/bot/package.json release/bot/package.json
          cp apps/bot/tsconfig.json release/bot/tsconfig.json
          cp apps/bot/.env.example release/bot/.env.example 2>/dev/null || true
          mkdir -p release/bot/packages
          cp -r packages/db release/bot/packages/db
          cp -r packages/shared release/bot/packages/shared
          cp -r packages/tsconfig release/bot/packages/tsconfig
          cp package.json release/bot/root-package.json
          cp bun.lock release/bot/bun.lock
          tar -czf crabcraft-bot-${{ github.sha }}.tar.gz -C release/bot .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crabcraft-bot
          path: crabcraft-bot-*.tar.gz
          retention-days: 3

  # ── Build Web → Next.js standalone output + Docker image ─────────
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - name: Build Next.js app
        run: bun run build --filter=@crabcraft/web
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"

  docker-web:
    name: Publish Web Docker Image
    needs: build-web
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=docker-web
          cache-to: type=gha,mode=min,scope=docker-web

  # ── Build Minecraft plugin → Spigot and Velocity JARs ────────────
  build-plugin:
    name: Build Minecraft Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: "25"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6
        with:
          cache-provider: basic

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use the format vMAJOR.MINOR.PATCH (for example, v1.2.3)."
            exit 1
          fi

      - name: Build JARs with Gradle
        run: |
          chmod +x apps/minecraft/gradlew
          cd apps/minecraft
          GRADLE_ARGS=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            GRADLE_ARGS="-Pversion=${GITHUB_REF_NAME#v}"
          fi
          ./gradlew build $GRADLE_ARGS

      - name: Generate SHA256SUMS.txt
        run: |
          cd apps/minecraft/jars
          sha256sum CrabUtilities.jar CrabUtilities-Velocity.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CrabUtilities-Spigot
          path: apps/minecraft/jars/CrabUtilities.jar
          retention-days: 3

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CrabUtilities-Velocity
          path: apps/minecraft/jars/CrabUtilities-Velocity.jar
          retention-days: 3

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CrabUtilities-All
          path: |
            apps/minecraft/jars/CrabUtilities.jar
            apps/minecraft/jars/CrabUtilities-Velocity.jar
            apps/minecraft/jars/SHA256SUMS.txt
          retention-days: 3

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CrabUtilities-Checksums
          path: apps/minecraft/jars/SHA256SUMS.txt
          retention-days: 3

  # ── Publish a GitHub Release only when a version tag is pushed ───
  release:
    name: Publish Release Assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-bot, build-plugin, docker-web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: "{crabcraft-bot,CrabUtilities-Spigot,CrabUtilities-Velocity,CrabUtilities-Checksums}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          files: |
            artifacts/crabcraft-bot/*.tar.gz
            artifacts/CrabUtilities-Spigot/CrabUtilities.jar
            artifacts/CrabUtilities-Velocity/CrabUtilities-Velocity.jar
            artifacts/CrabUtilities-Checksums/SHA256SUMS.txt
          generate_release_notes: true

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'com.gradleup.shadow'
}

base {
    archivesName = 'CrabUtilities-NeoForge'
}

// NeoForge 1.20.1 targets Java 17. Override the root toolchain (Java 21).
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(17)
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'Mojang'
        url = 'https://libraries.minecraft.net/'
    }
}

minecraft {
    // Last NeoForge release on the 1.20.1 line.
    mappings channel: 'official', version: '1.20.1'

    // No accessTransformers, no patches — we only touch public API.

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'crabutilities'
            mods {
                crabutilities {
                    source sourceSets.main
                }
            }
        }
        server {
            args '--nogui'
        }
    }
}

configurations {
    shaded
    implementation.extendsFrom shaded
}

dependencies {
    minecraft 'net.neoforged:forge:1.20.1-47.1.106'

    shaded('redis.clients:jedis:5.1.0') {
        // SLF4J is provided by NeoForge's runtime; don't bundle a second copy.
        exclude group: 'org.slf4j'
    }
}

processResources {
    def props = [version: project.version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('META-INF/mods.toml') {
        expand props
    }
}

shadowJar {
    configurations = [project.configurations.shaded]
    archiveClassifier.set('')
    archiveVersion.set('')
    relocate 'redis.clients.jedis', 'crabcraft.net.libs.jedis'
    relocate 'org.apache.commons.pool2', 'crabcraft.net.libs.pool2'
    relocate 'org.json', 'crabcraft.net.libs.json'
    mergeServiceFiles()

    // Forge's mod loader scans for this manifest entry to flag the jar
    // as a mod. Shadow drops manifests by default — preserve ours.
    manifest.inheritFrom project.tasks.jar.manifest
}

// Reobfuscate the shadow output so any obfuscated MC references are
// remapped at build time. Our code only touches public Forge API + a
// stable LevelResource constant, so the remap is a no-op in practice,
// but wire it up so future additions Just Work.
reobf {
    shadowJar {}
}

tasks.jar {
    archiveClassifier.set('slim')
    manifest {
        attributes([
            'Specification-Title'     : 'crabutilities',
            'Specification-Vendor'    : 'crabcraft.net',
            'Specification-Version'   : '1',
            'Implementation-Title'    : 'CrabUtilities-NeoForge',
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'crabcraft.net'
        ])
    }
}

tasks.shadowJar.dependsOn(tasks.jar)
tasks.build.dependsOn(tasks.reobfShadowJar)

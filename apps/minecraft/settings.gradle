pluginManagement {
    repositories {
        // ForgeGradle (for the neoforge subproject) is hosted here.
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'CrabUtilities'

include 'spigot'
include 'velocity'
include 'neoforge'

name: CrabBingoCard6Test
version: '${version}'
main: crabcraft.net.bingotest.CrabBingoTestPlugin
api-version: '26.2'
authors: [Max]
website: https://www.crabcraft.net
description: Bingo #6 task detector test harness.
commands:
  bingotest:
    description: Show, explain or reset the Bingo #6 detector checklist.
    usage: /bingotest [list|details <number>|reset]
    aliases: [btasks]
    permission: crabbingotest.use
permissions:
  crabbingotest.use:
    description: Use the Bingo #6 detector checklist.
    default: true

redis:
  host: "localhost"
  port: 6379
  password: ""
  channel: "crabutilities:staffchat"

api:
  port: 8080

staff-chat:
  # MiniMessage format. Placeholders: <sender>, <message>
  format: "<dark_gray>[<aqua>SC</aqua>]</dark_gray> <gray><sender></gray> <dark_gray>></dark_gray> <white><message></white>"
  # Discord relay for staff chat. Leave webhook-url empty to disable.
  # The webhook posts as the sender's nickname with their head as the avatar.
  # avatar-url placeholder: {uuid}
  discord:
    webhook-url: ""
    avatar-url: "https://mc-heads.net/head/{uuid}"

private-messages:
  # MiniMessage format shown to the sender. Placeholders: <target>, <message>
  outgoing-format: "<gold>(to <target>) <white><message>"
  # MiniMessage format shown to the recipient. Placeholders: <sender>, <message>
  incoming-format: "<gold>(from <sender>) <white><message>"
  # MiniMessage format shown to /socialspy listeners. Placeholders: <sender>, <target>, <message>
  spy-format: "<gray>[SPY] (<sender> → <target>) <white><message>"
  # Error messages (MiniMessage)
  player-not-found: "<red>Player not found or not online."
  no-reply-target: "<red>You have no one to reply to."
  self-error: "<red>You can't message yourself."

join-leave-messages:
  # Servers that should NOT trigger join/leave/swap messages
  ignored-servers: []
  # MiniMessage format for first-time join. Placeholders: <name>, <username>
  first-join: "<yellow><name> joined the game for the first time</yellow>"
  # Discord webhook integration. Leave webhook-url empty to disable.
  # Placeholders: {name} (nickname or username), {username} (always raw), {server} (current server)
  discord:
    webhook-url: ""
    join: "{name} joined the game"
    leave: "{name} left the game"
    swap: "{name} swapped to the {server} server"
    first-join: "{name} joined the game for the first time!"

database:
  url: "jdbc:postgresql://localhost:5432/crabcraft"
  username: "crabcraft"
  password: ""

# Automatic updates — polls GitHub Releases and downloads the new proxy JAR to
# plugins/CrabUtilities-Velocity.jar.staged. Stop the proxy, replace the live
# jar with the .staged file, then start the proxy to apply.
auto-update:
  enabled: true
  check-interval-hours: 6
  include-prereleases: false
  github-repo: "CrabCraftMC/CrabCraft"
  # Optional personal-access token; unauthenticated requests are limited to 60/hour.
  github-token: ""

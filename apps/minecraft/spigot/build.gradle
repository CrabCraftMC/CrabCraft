def runtimeOnlyRegressionTests = [
    'voiceRelayRegressionTest',
    'nicknameSoftDependencyRegressionTest',
] as Set

regressionTests.each { taskName, testClass ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        if (!runtimeOnlyRegressionTests.contains(taskName)) {
            classpath += sourceSets.main.compileClasspath
        }
        mainClass.set(testClass)
    }
}

tasks.register('pluginJarContentsRegressionTest') {
    group = 'verification'
    dependsOn tasks.named('shadowJar')

    doLast {
        Set<String> expected = new TreeSet<>()
        sourceSets.main.output.classesDirs.files.each { root ->
            if (!root.isDirectory()) return
            fileTree(root).matching { include '**/*.class' }.visit { details ->
                if (!details.directory) expected.add(details.relativePath.pathString)
            }
        }

        Set<String> packaged = new HashSet<>()
        File archive = tasks.named('shadowJar').get().archiveFile.get().asFile
        zipTree(archive).visit { details ->
            if (!details.directory && details.relativePath.pathString.endsWith('.class')) {
                packaged.add(details.relativePath.pathString)
            }
        }

        Set<String> missing = expected.findAll { !packaged.contains(it) }
        if (!missing.isEmpty()) {
            throw new GradleException(
                "Production plugin JAR is missing compiled classes: " + missing.join(', '))
        }
    }
}

tasks.named('test') {
    failOnNoDiscoveredTests = false
}

tasks.named('check') {
    dependsOn regressionTests.keySet()
    dependsOn tasks.named('pluginJarContentsRegressionTest')
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    from(rootProject.file('../../LICENSE')) {
        into 'META-INF'
    }
    from(rootProject.file('../../THIRD_PARTY_NOTICES.md')) {
        into 'META-INF'
    }
    filesMatching('plugin.yml') {
        expand props
    }
}

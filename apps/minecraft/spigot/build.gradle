plugins {
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.21'
    id("xyz.jpenilla.run-paper") version "3.0.2"
    id 'com.gradleup.shadow'
}

base {
    archivesName = 'CrabUtilities'
}

repositories {
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "essentialsx"
        url = uri("https://repo.essentialsx.net/releases/")
    }
    maven {
        name = "papermc"
        url = uri("https://repo.papermc.io/repository/maven-public/")
    }
    maven {
        name = "henkelmax.public"
        url = uri("https://maven.maxhenkel.de/repository/public")
    }
    maven {
        name = "placeholderapi"
        url = uri("https://repo.extendedclip.com/content/repositories/placeholderapi/")
    }
    maven {
        name = "bluecolored"
        url = uri("https://repo.bluecolored.de/releases")
    }
    maven {
        name = "codemc"
        url = uri("https://repo.codemc.io/repository/maven-releases/")
    }
    maven {
        name = "tcoded"
        url = uri("https://repo.tcoded.com/releases")
    }
    maven {
        name = "simple-yaml-mirror"
        url = uri("https://repo.subkek.space/maven-public/")
    }
}

dependencies {
    paperweight.paperDevBundle("26.1.2.build.72-stable")
    compileOnly("net.essentialsx:EssentialsX:2.20.1") {
        // EssentialsX 2.20.1 transitively pulls spigot-api:1.20.1 which conflicts
        // with paper-api:26.1.2 on the org.spigotmc:spigot-api capability.
        exclude group: "org.spigotmc", module: "spigot-api"
    }
    compileOnly("net.kyori:adventure-text-serializer-legacy:4.17.0")
    compileOnly("net.kyori:adventure-text-minimessage:4.17.0")
    compileOnly("de.maxhenkel.voicechat:voicechat-api:2.6.13")
    testImplementation("de.maxhenkel.voicechat:voicechat-api:2.6.13")
    compileOnly("me.clip:placeholderapi:2.11.6")
    compileOnly("de.bluecolored:bluemap-api:2.7.7")
    compileOnly("com.github.retrooper:packetevents-spigot:2.13.0")
    testCompileOnly("com.github.retrooper:packetevents-spigot:2.13.0")
    compileOnly("org.projectlombok:lombok:1.18.46")
    annotationProcessor("org.projectlombok:lombok:1.18.46")
    implementation("redis.clients:jedis:5.1.0")
    implementation("com.tcoded:FoliaLib:0.5.1")
    implementation("me.carleslc:Simple-Yaml:1.8.4")
}

shadowJar {
    configurations = [project.configurations.runtimeClasspath]
    archiveClassifier.set('')
    archiveVersion.set('')
    addMultiReleaseAttribute.set(false)
    exclude 'META-INF/versions/9/org/yaml/snakeyaml/internal/Logger*.class'
    relocate 'redis.clients.jedis', 'crabcraft.net.libs.jedis'
    relocate 'org.apache.commons.pool2', 'crabcraft.net.libs.pool2'
    relocate 'org.json', 'crabcraft.net.libs.json'
    relocate 'com.tcoded.folialib', 'crabcraft.net.libs.folialib'
    relocate 'org.simpleyaml', 'crabcraft.net.libs.simpleyaml'
}

tasks.jar {
    archiveClassifier.set('slim')
}

tasks.build.dependsOn(tasks.shadowJar)

tasks {
    runServer {
        minecraftVersion("26.1.2")
    }
}

tasks.register('voiceRelayRegressionTest', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('crabcraft.net.crabUtilities.voicechat.VoiceRelayRegressionTest')
}

tasks.register('loginStreakCacheRegressionTest', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath

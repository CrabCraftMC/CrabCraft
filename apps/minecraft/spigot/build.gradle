tasks.named('test') {
    failOnNoDiscoveredTests = false
}

tasks.named('check') {
    dependsOn tasks.named('voiceRelayRegressionTest')
    dependsOn tasks.named('loginStreakCacheRegressionTest')
    dependsOn tasks.named('statsPushPathRegressionTest')
    dependsOn tasks.named('globalChatLinkRegressionTest')
    dependsOn tasks.named('chatMiniMessageRegressionTest')
    dependsOn tasks.named('xaeroLifecycleRegressionTest')
    dependsOn tasks.named('nicknameMessagesRegressionTest')
    dependsOn tasks.named('nicknameRegressionTest')
    dependsOn tasks.named('nicknameSoftDependencyRegressionTest')
    dependsOn tasks.named('lofiVoicechatRegressionTest')
    dependsOn tasks.named('suspiciousBrushTrackerRegressionTest')
    dependsOn tasks.named('experienceClumpsRegressionTest')
    dependsOn tasks.named('jadeProtocolRegressionTest')
    dependsOn tasks.named('jadeResponseIsolationRegressionTest')
    dependsOn tasks.named('jadeItemStorageEncodingRegressionTest')
    dependsOn tasks.named('jadeClientProtocolPayloadRegressionTest')
    dependsOn tasks.named('customPortalDestinationRegressionTest')
    dependsOn tasks.named('customDiscsSecurityRegressionTest')
    dependsOn tasks.named('binaryProvisionerRegressionTest')
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

name: CrabUtilities
version: '${version}'
main: crabcraft.net.crabUtilities.CrabUtilities
api-version: '26.3'
authors: [Max]
website: https://www.crabcraft.net
softdepend:
  - Essentials
  - InteractiveChat
  - voicechat
  - packetevents
  - PlaceholderAPI
  - BlueMap
  - Nexo
commands:
  gamemode:
    description: Change your game mode or another player's game mode.
    usage: /gamemode <creative|survival|spectator|adventure> [player]
    aliases: [gm]
  gmc:
    description: Switch to creative mode.
    usage: /gmc [player]
    aliases: [creative]
  gms:
    description: Switch to survival mode.
    usage: /gms [player]
    aliases: [survival]
  gmsp:
    description: Switch to spectator mode.
    usage: /gmsp [player]
    aliases: [spectator]
  gma:
    description: Switch to adventure mode.
    usage: /gma [player]
    aliases: [adventure]
  invsee:
    description: Inspect a player's inventory, armour and offhand.
    usage: /invsee <player>
    permission: crabutilities.invsee
  echest:
    description: Open your own or another player's ender chest.
    usage: /echest [player]
    aliases: [enderchest, ec]
    permission: crabutilities.echest
  afk:
    description: Toggle your cosmetic AFK status.
    usage: /afk
    permission: crabutilities.afk
  halloween:
    description: Show the Halloween tasks and your progress.
    usage: /halloween
  crabutilities:
    description: CrabUtilities admin commands.
    usage: /crabutilities <reload|update|viewdistance>
  portalcoords:
    description: Portal coordinate utilities.
    usage: /portalcoords [at <x> <z> in <overworld|nether>]
  jadehandshake:
    description: Resend the Jade server handshake to your client.
    permission: crabutilities.jade.handshake
  settings:
    description: Open your personal settings menu.
    usage: /settings [tags|phantoms <on|off|safe>|mentions <on|off>|messages <on|off>|locatorbar <on|off>|bingo <on|off>|coordinatehud <on|off>]
    permission: crabutilities.settings
  tags:
    description: Choose an unlocked tag to display before your name.
    usage: /tags
    permission: crabutilities.settings
  slime:
    description: Show nearby slime chunks or check the chunk you are standing in.
    usage: /slime <map|chunk>
  specback:
    description: Return to where you entered spectator mode.
    usage: /specback
    permission: crabutilities.specback
  smite:
    description: Smite a player.
    usage: /smite <player>
    permission: crabutilities.smite
  model:
    description: Apply a custom cosmetic model to a helmet or split it back out.
    usage: /model <merge|split>
  msg:
    description: Send a cross-server private message.
    usage: /msg <player> <message>
    aliases: [message, tell, whisper, w, dm]
  r:
    description: Reply to your most recent private-message partner.
    usage: /r <message>
    aliases: [reply]
  sc:
    description: Send a cross-server staff-chat message.
    usage: /sc <message>
    aliases: [staffchat]
  staffvc:
    description: Join or leave the private staff voice-chat group.
    usage: /staffvc
    permission: crabutilities.staffvc
permissions:
  crabutilities.gamemode.creative:
    description: Switch to creative mode.
    default: op
  crabutilities.gamemode.survival:
    description: Switch to survival mode.
    default: op
  crabutilities.gamemode.spectator:
    description: Switch to spectator mode.
    default: op
  crabutilities.gamemode.adventure:
    description: Switch to adventure mode.
    default: op
  crabutilities.gamemode.others:
    description: Change another player's game mode, subject to the mode's permission.
    default: op
  crabutilities.invsee:
    description: View online or offline player inventories on this backend.
    default: op
  crabutilities.invsee.modify:
    description: Modify inspected inventories, including armour and offhand.
    default: op
  crabutilities.echest:
    description: Open your own ender chest.
    default: true
  crabutilities.echest.others:
    description: View online or offline ender chests on this backend.
    default: op
  crabutilities.echest.modify:
    description: Modify another player's ender chest.
    default: op
  crabutilities.afk:
    description: Toggle your cosmetic AFK status.
    default: true
  crabutilities.vanish:
    description: Toggle your network-wide vanish state through Velocity.
    default: op
  crabutilities.vanish.see:
    description: See vanished players in the world and tab list.
    default: op
  crabutilities.staffchat:
    description: Access staff chat and see vanished players.
    default: op
  crabutilities.staffvc:
    description: Join the hidden, isolated staff voice-chat group.
    default: op
  crabutilities.restricted-area.bypass:
    description: Bypass unverified-player grief protection.
    default: op
  crabutilities.reload:
    description: Reload CrabUtilities configuration.
    default: op
  crabutilities.update:
    description: Run CrabUtilities update commands.
    default: op
  crabutilities.viewdistance.admin:
    description: Inspect and control adaptive simulation and view distances.
    default: op
  crabutilities.jade.handshake:
    description: Resend the Jade server handshake to your client.
    default: true
  crabutilities.settings:
    description: Use the /settings menu to configure personal preferences.
    default: true
  crabutilities.slime.map:
    description: Open the nearby slime-chunk map.
    default: true
  crabutilities.slime.chunk:
    description: Check whether the current chunk is a slime chunk.
    default: true
  crabutilities.specback:
    description: Return to where you entered spectator mode.
    default: op
  crabutilities.model.merge:
    description: Apply a held custom item's model to a held helmet.
    default: true
  crabutilities.model.split:
    description: Remove an applied model and recover the original custom item.
    default: true
  crabutilities.bluemap.marker:
    description: Create BlueMap markers by writing the marker keyword on a sign.
    default: true
  crabutilities.media.help:
    description: View Crab Utilities media help.
    default: true
  crabutilities.media.create:
    description: Create and edit playable discs and horns.
    default: true
  crabutilities.media.create.remote:
    description: Use remote URLs for media playback.
    default: true
  crabutilities.media.create.remote.youtube:
    description: Use YouTube URLs for media playback.
    default: true
  crabutilities.media.create.remote.soundcloud:
    description: Use SoundCloud URLs for media playback.
    default: true
  crabutilities.media.create.remote.http:
    description: Use direct HTTP URLs for media playback.
    default: op

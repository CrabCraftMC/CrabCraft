name: CrabUtilities
version: '${version}'
main: crabcraft.net.crabUtilities.CrabUtilities
api-version: '1.21'
provides: [CustomDiscs]
authors: [Max]
website: https://www.crabcraft.net
softdepend:
  - Essentials
  - voicechat
  - packetevents
  - PlaceholderAPI
  - BlueMap
commands:
  crabutilities:
    description: CrabUtilities admin commands.
    usage: /crabutilities <reload|update check|update download|update status>
  jadehandshake:
    description: Resend the Jade server handshake to your client.
    permission: crabutilities.jade.handshake
  settings:
    description: Open your personal settings menu (phantoms, chat pings, messages, locator bar).
    usage: /settings [phantoms <on|off|safe>|mentions <on|off>|messages <on|off>|locatorbar <on|off>]
    permission: crabutilities.settings
permissions:
  crabutilities.reload:
    description: Reload CrabUtilities configuration.
    default: op
  crabutilities.update:
    description: Run CrabUtilities update commands.
    default: op
  crabutilities.jade.handshake:
    description: Resend the Jade server handshake to your client.
    default: true
  crabutilities.settings:
    description: Use the /settings menu to configure personal preferences.
    default: true
  crabutilities.bluemap.marker:
    description: Create BlueMap markers by writing the marker keyword on a sign.
    default: true
  customdiscs.help:
    description: View CustomDiscs help.
    default: true
  customdiscs.reload:
    description: Reload the custom-discs configuration.
    default: op
  customdiscs.create:
    description: Create and edit custom discs and horns.
    default: true
  customdiscs.create.remote:
    description: Use remote media URLs for custom audio.
    default: true
  customdiscs.create.remote.youtube:
    description: Use YouTube URLs for custom audio.
    default: true
  customdiscs.create.remote.soundcloud:
    description: Use SoundCloud URLs for custom audio.
    default: true
  customdiscs.create.remote.http:
    description: Use direct HTTP URLs for custom audio.
    default: op

# CrabUtilities - Gameplay

# Per-player phantom control via /settings (on / off / safe). Set
# suppress-for-opted-out false to force vanilla phantoms for everyone.
phantoms:
  suppress-for-opted-out: true

# Prevent unverified players from griefing blocks, containers, and entities in every world.
# Operators and players with bypass-permission are exempt.
# Legacy bounds, world, and return-location entries are ignored.
restricted-area:
  enabled: false
  bypass-permission: "crabutilities.restricted-area.bypass"

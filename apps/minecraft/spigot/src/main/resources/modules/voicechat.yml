# CrabUtilities - Voice Chat

# Simple Voice Chat cross-server bridge. Redis mirrors every group (including
# its password and mode) and relays grouped audio between backends.
voicechat:
  # Persistent cross-server group with a continuously playing administrator-configured source.
  lofi:
    enabled: true
    # Accepts HTTP(S) media on public or private networks. Never populate this from player input.
    youtube-url: "https://www.youtube.com/watch?v=8TIVlFtcRDU"
    # Linear volume multipliers: 0.5 = 50%; 0.25 = 75% quieter.
    music-volume: 0.5
    player-volume: 0.25
  cross-server:
    enabled: true
    # Velocity server name for THIS backend; must match velocity.toml's
    # [servers] section.
    this-backend: ""
    # Always-present OPEN groups. Player-created groups are synced automatically.
    persistent-groups:
      - "Global #1"
      - "Global #2"
      - "Global #3"

# CrabUtilities - Spigot Plugin Configuration

# Season this server writes data to (e.g. "6"). Empty disables stats,
# awards, and advancement syncing.
season: ""

redis:
  host: "localhost"
  port: 6379
  password: ""

# How often the world's stats/ and advancements/ folders are scanned and
# published to Redis for the proxy to process.
stats-push:
  interval-minutes: 5

auto-update:
  enabled: true
  check-interval-hours: 6
  include-prereleases: false
  notify-ops: true
  github-repo: "CrabCraftMC/CrabCraft"
  github-token: ""

# Server-side companions for client-side mods. Harmless for players without
# the matching mod installed.
mod-protocols:
  jade:
    enabled: true
  appleskin:
    enabled: true
  xaero-map:
    enabled: true
    # World id sent to Xaero clients so saved maps stay per-world behind a
    # proxy. 0 generates a random id on first start and writes it back here.
    server-id: 0

# Player chat accepts colours plus bold, italic, underline and strikethrough.
# Interactive/data MiniMessage tags such as click, hover, insertion and font
# are rejected. Plain HTTP and HTTPS URLs become clickable links.
#
# Sync normal chat across the network via Redis. Servers left off keep their
# chat local. Staff chat is unaffected.
global-chat:
  enabled: false
  # MiniMessage format. Placeholders: <display_name>, <username>, <message>.
  format: "<display_name><gray>:</gray> <message>"
  mentions:
    enabled: true
    prefix: "@"
    highlight: "<yellow><name></yellow>"
    sound:
      enabled: true
      key: "minecraft:block.note_block.pling"
      volume: 1.0
      pitch: 1.0

# Simple Voice Chat cross-server bridge. Forwards opus frames between backends
# over Redis so members of a persistent group hear each other across servers.
voicechat:
  # Persistent cross-server group with a continuously playing YouTube Live source.
  lofi:
    enabled: true
    youtube-url: "https://www.youtube.com/watch?v=8TIVlFtcRDU"
    # Linear volume multipliers: 0.5 = 50%; 0.25 = 75% quieter.
    music-volume: 0.5
    player-volume: 0.25
  cross-server:
    enabled: true
    # Velocity server name for THIS backend; must match velocity.toml's
    # [servers] section.
    this-backend: ""
    persistent-groups:
      - "Global #1"
      - "Global #2"
      - "Global #3"

# Per-player phantom control via /settings (on / off / safe). Set
# suppress-for-opted-out false to force vanilla phantoms for everyone.
phantoms:
  suppress-for-opted-out: true

# BlueMap integration. Soft dependency; skipped when BlueMap isn't installed.
bluemap:
  # Writing the keyword on a sign's top line adds a POI marker at the sign;
  # breaking or editing the sign removes it. Markers persist in
  # bluemap-sign-markers.yml.
  sign-markers:
    enabled: false
    keyword: "[map]"
    marker-set-label: "Player Markers"
    toggleable: true
    default-hidden: false
    # Optional custom icon path/URL resolved against BlueMap's web root. The
    # anchor is the icon pixel that sits on the marker position.
    icon: ""
    icon-anchor-x: 0
    icon-anchor-y: 0

# Optional gameplay tweaks, all disabled by default.
tweaks:
  # Announce who slept when the night is skipped.
  sleep-broadcast:
    enabled: false
    # Placeholder: <player>.
    single-format: "<#FCD05C><player></#FCD05C><#b0b0b0> slept to skip the night.</#b0b0b0>"
    # Placeholders: <players>, <count>.
    multiple-format: "<#FCD05C><players></#FCD05C><#b0b0b0> slept to skip the night.</#b0b0b0>"

  # Portals of any shape/size bounded by frame material, not just the vanilla
  # rectangle. Port of VanillaTweaks' Custom Nether Portals.
  custom-nether-portals:
    enabled: false
    frame-materials:
      - "OBSIDIAN"
      - "CRYING_OBSIDIAN"
    size:
      min-portal-blocks: 6
      max-portal-width: 23
      max-portal-height: 23

  # Reactively lower simulation/view distances when tick time is high and
  # cautiously raise them again after performance has remained healthy.
  # Uses ViewDistanceTweaks' reactive defaults: check every 30 seconds,
  # decrease at 47+ MSPT, and increase at 40- MSPT after 10 passed checks.
  view-distance:
    enabled: false
    simulation-distance:
      minimum: 6
      maximum: 12
    view-distance:
      minimum: 8
      maximum: 16

  # Faster happy ghasts while ridden; unridden ghasts stay vanilla.
  happy-ghast:
    ridden-speed-boost:
      enabled: false
      # Multiple of vanilla ridden speed. Must be positive; 1.0 = no change.
      multiplier: 2.0

  # Toss an item into a water cauldron to transform it in place.
  cauldron:
    # Concrete powder -> concrete.
    concrete:
      enabled: false
    # Dirt / coarse dirt / rooted dirt -> mud.
    mud:
      enabled: false

  # Auto-unlock every server recipe on join so nothing has to be discovered.
  unlock-all-recipes:
    enabled: false

  # Stop endermen picking up or placing blocks (endermen only, unlike the
  # mobGriefing game rule).
  enderman-grief:
    prevent: false

  # Scale shulker shell drops by who scored the kill, so hand-farming beats
  # automatic farms. Vanilla drop chance/Looting are unchanged; the amount is
  # multiplied only after a shell actually drops. 1 = vanilla.
  shulker-shells:
    enabled: false
    player-kill-multiplier: 2
    other-multiplier: 1

  # Drop the killed player's head on player kills. The head lore records the killer.
  player-head-drops:
    enabled: false

  # Player heads keep their custom name and lore when broken and replaced.
  persistent-heads:
    enabled: false

  # Merge nearby experience orbs as they spawn to reduce entity counts during PVP.
  # Uses the same three-block search radius as PVPClumps.
  pvp-clumps:
    enabled: false

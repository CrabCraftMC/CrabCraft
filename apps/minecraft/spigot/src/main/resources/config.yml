# CrabUtilities configuration

# REQUIRED: You must set both server-id and season before stats will be pushed.
# Identifier for this backend server. Must be unique across the network
# and match the server name configured in the Velocity proxy.
server-id: ""

# Season this server writes data to. Examples: "6" for SMP season 6,
# "creative" for a permanent creative server, "events" for an events server.
season: ""

redis:
  host: "localhost"
  port: 6379
  password: ""

# Periodic scan of the world's stats/ folder. Each changed
# stats/<uuid>.json is published on the crabutilities:stats-push
# Redis channel for the Velocity proxy to compute awards from.
stats-push:
  interval-minutes: 5

resource-pack:
  # URL to your resource pack (must be direct URL)
  url: ""
  # Optional SHA-1 hash of the resource pack in hex (40 chars). If set, it's sent with the pack
  hash: ""
  # Players (UUIDs) who have opted in to automatically receive the pack on join
  auto-enabled: []

# Automatic updates — polls GitHub Releases and stages the new JAR into
# plugins/update/ so Paper swaps it in on the next server restart.
auto-update:
  enabled: true
  check-interval-hours: 6
  include-prereleases: false
  notify-ops: true
  github-repo: "CrabCraftMC/CrabCraft"
  # Optional personal-access token; unauthenticated requests are limited to 60/hour.
  github-token: ""

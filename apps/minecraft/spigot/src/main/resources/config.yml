# CrabUtilities - Spigot Plugin Configuration

# Season this server writes data to (e.g. "6").
# Leave empty to disable stats, awards, and advancement syncing.
season: ""

# Redis - used for publishing stats to the Velocity proxy
# and syncing nicknames across servers.
redis:
  host: "localhost"
  port: 6379
  password: ""

# Periodically scans the world's stats/ and advancements/ folders.
# Changed files are published to Redis for the Velocity proxy to
# process into awards, leaderboards, and advancement tracking.
stats-push:
  interval-minutes: 5

# Polls GitHub Releases for new versions and stages the JAR into
# plugins/update/ so Paper swaps it in on the next restart.
auto-update:
  enabled: true
  check-interval-hours: 6
  include-prereleases: false
  notify-ops: true
  github-repo: "CrabCraftMC/CrabCraft"
  github-token: ""

# Server-side companions for client-side mods. Each feeds extra data to
# players who have the matching mod installed and is harmless for players who
# don't. Toggle any of them off here.
mod-protocols:
  # Jade (the "what am I looking at" tooltip mod): block/entity info such as
  # tool requirements, growth/breeding progress, container contents, etc.
  jade:
    enabled: true
  # AppleSkin: saturation, exhaustion and natural-regeneration info on the
  # hunger bar.
  appleskin:
    enabled: true
  # Xaero's Minimap / World Map: on join, sends a small "world id" packet so
  # clients store saved maps keyed off that id instead of the connection
  # address. Behind a proxy every backend shares one IP, so without this Xaero
  # would merge the maps of different worlds; with it, each world keeps its own.
  xaero-map:
    enabled: true
    # Integer identifying this world to Xaero clients. Leave at 0 to generate a
    # random id on first start and write it back here (so it stays stable across
    # restarts). Changing it makes Xaero treat this as a brand-new world.
    server-id: 0

# Global chat: sync this server's normal chat across the network via Redis.
# DISABLED by default. Turn this on only for servers that should share one
# chat; servers left off keep their chat local. Staff chat is unaffected.
global-chat:
  enabled: false
  # Shown via the <server> placeholder in the format. Optional, free text.
  server-name: ""
  # MiniMessage format for each line. Placeholders: <server>, <display_name>,
  # <username>, <message>. Player text fills <message> and is never parsed as
  # MiniMessage (no tag injection).
  format: "<gray>[</gray><aqua><server></aqua><gray>]</gray> <display_name><gray>:</gray> <message>"
  mentions:
    enabled: true
    # Trigger character before a name, e.g. @Steve.
    prefix: "@"
    # MiniMessage wrapping applied to a matched @name token. <name> = the token.
    highlight: "<yellow><underlined><name></underlined></yellow>"
    sound:
      enabled: true
      key: "minecraft:block.note_block.pling"
      volume: 1.0
      pitch: 1.0

# Simple Voice Chat cross-server bridge.
# Creates a fixed set of persistent open voice groups with deterministic
# UUIDs on every backend, then forwards opus frames between backends
# over Redis pub/sub so members on different backends can hear each
# other in the same group. User-created GUI groups remain local to
# whichever backend they were created on.
voicechat:
  cross-server:
    # Toggle the whole bridge. If false, voice still works locally on
    # each backend (native SVC behaviour) but the persistent groups
    # below stay per-backend.
    enabled: true
    # Velocity-side server name for THIS backend. Must match the name
    # configured in velocity.toml's [servers] section. Used so the
    # receiver can verify that frames claiming to come from "this
    # backend" really originated here, preventing a brief audio glitch
    # when a player switches servers while talking.
    this-backend: ""
    # Persistent open groups created automatically with deterministic
    # UUIDs so all backends have the same group IDs. Cross-server audio
    # is forwarded for any group whose name appears here.
    persistent-groups:
      - "Global #1"
      - "Global #2"
      - "Global #3"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: crabcraft
      POSTGRES_PASSWORD: crabcraft_dev
      POSTGRES_DB: crabcraft
    volumes:
      # PostgreSQL 18 uses a new on-disk layout. Keep the v18 volume separate
      # from existing pg_data volumes; see docs/postgresql-18-upgrade.md.
      - pg18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crabcraft"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pg18_data:
  redis_data:
